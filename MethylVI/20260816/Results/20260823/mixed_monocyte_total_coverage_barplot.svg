<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">杂色细胞与 ROI 内单核细胞的多指标条形图</title>
  <desc id="desc">四个面板分别比较细胞数、总覆盖量、覆盖区间数和总覆盖量的 log1p 值；每项均有杂色细胞和 ROI 内单核细胞两根柱。</desc>
  <rect width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#222222">杂色细胞与 ROI 内单核细胞对比</text>
  <text x="700" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#555555">全部已报告测序深度指标的双柱比较</text>

  <!-- global legend -->
  <rect x="477" y="91" width="24" height="16" rx="2" fill="#d7301f"/>
  <text x="510" y="105" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">ROI 内杂色非单核细胞</text>
  <rect x="758" y="91" width="24" height="16" rx="2" fill="#756bb1"/>
  <text x="791" y="105" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">ROI 内单核细胞</text>

  <!-- panel backgrounds -->
  <g fill="#fafafa" stroke="#d9d9d9" stroke-width="1.2">
    <rect x="45" y="125" width="445" height="335" rx="8"/>
    <rect x="510" y="125" width="845" height="335" rx="8"/>
    <rect x="45" y="485" width="635" height="405" rx="8"/>
    <rect x="700" y="485" width="655" height="405" rx="8"/>
  </g>

  <!-- A: cell counts -->
  <text x="267" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">A. 细胞数</text>
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="105" y1="390" x2="455" y2="390"/>
    <line x1="105" y1="335" x2="455" y2="335"/>
    <line x1="105" y1="280" x2="455" y2="280"/>
    <line x1="105" y1="225" x2="455" y2="225"/>
    <line x1="105" y1="170" x2="455" y2="170"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" text-anchor="end">
    <text x="96" y="395">0</text><text x="96" y="340">200</text><text x="96" y="285">400</text><text x="96" y="230">600</text><text x="96" y="175">800</text>
  </g>
  <line x1="105" y1="170" x2="105" y2="390" stroke="#333333"/><line x1="105" y1="390" x2="455" y2="390" stroke="#333333"/>
  <rect x="165" y="344.6" width="95" height="45.4" fill="#d7301f" stroke="#222222"/>
  <rect x="305" y="189.0" width="95" height="201.0" fill="#756bb1" stroke="#222222"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="212.5" y="336" fill="#d7301f">165</text><text x="352.5" y="181" fill="#54278f">731</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#333333">
    <text x="212.5" y="416">杂色细胞</text><text x="352.5" y="416">ROI 内单核细胞</text>
  </g>
  <text x="280" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#777777">仅表示组内细胞数量，不代表质控优劣</text>

  <!-- B: total coverage -->
  <text x="932" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">B. 总覆盖量</text>
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="570" y1="390" x2="1320" y2="390"/>
    <line x1="570" y1="335" x2="1320" y2="335"/>
    <line x1="570" y1="280" x2="1320" y2="280"/>
    <line x1="570" y1="225" x2="1320" y2="225"/>
    <line x1="570" y1="170" x2="1320" y2="170"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" text-anchor="end">
    <text x="560" y="395">0</text><text x="560" y="340">10万</text><text x="560" y="285">20万</text><text x="560" y="230">30万</text><text x="560" y="175">40万</text>
  </g>
  <line x1="570" y1="170" x2="570" y2="390" stroke="#333333"/><line x1="570" y1="390" x2="1320" y2="390" stroke="#333333"/>
  <!-- mean -->
  <rect x="615" y="221.3" width="58" height="168.7" fill="#d7301f" stroke="#222222"/>
  <rect x="679" y="266.1" width="58" height="123.9" fill="#756bb1" stroke="#222222"/>
  <!-- median -->
  <rect x="795" y="218.8" width="58" height="171.2" fill="#d7301f" stroke="#222222"/>
  <rect x="859" y="273.9" width="58" height="116.1" fill="#756bb1" stroke="#222222"/>
  <!-- q25 -->
  <rect x="975" y="262.9" width="58" height="127.1" fill="#d7301f" stroke="#222222"/>
  <rect x="1039" y="292.9" width="58" height="97.1" fill="#756bb1" stroke="#222222"/>
  <!-- q75 -->
  <rect x="1155" y="182.3" width="58" height="207.7" fill="#d7301f" stroke="#222222"/>
  <rect x="1219" y="250.4" width="58" height="139.6" fill="#756bb1" stroke="#222222"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="644" y="213" fill="#b2180d">306,779</text><text x="708" y="258" fill="#54278f">225,264</text>
    <text x="824" y="211" fill="#b2180d">311,361</text><text x="888" y="266" fill="#54278f">211,048</text>
    <text x="1004" y="255" fill="#b2180d">231,161</text><text x="1068" y="285" fill="#54278f">176,615</text>
    <text x="1184" y="175" fill="#b2180d">377,546</text><text x="1248" y="243" fill="#54278f">253,861</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333" text-anchor="middle">
    <text x="676" y="416">均值</text><text x="856" y="416">中位数</text><text x="1036" y="416">下四分位数</text><text x="1216" y="416">上四分位数</text>
  </g>

  <!-- C: covered bins -->
  <text x="362" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">C. 覆盖的 5 kb 区间数</text>
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="110" y1="820" x2="640" y2="820"/><line x1="110" y1="773" x2="640" y2="773"/><line x1="110" y1="726" x2="640" y2="726"/><line x1="110" y1="678" x2="640" y2="678"/><line x1="110" y1="631" x2="640" y2="631"/><line x1="110" y1="584" x2="640" y2="584"/><line x1="110" y1="560" x2="640" y2="560"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" text-anchor="end">
    <text x="100" y="825">0</text><text x="100" y="778">1万</text><text x="100" y="731">2万</text><text x="100" y="683">3万</text><text x="100" y="636">4万</text><text x="100" y="589">5万</text><text x="100" y="565">5.5万</text>
  </g>
  <line x1="110" y1="560" x2="110" y2="820" stroke="#333333"/><line x1="110" y1="820" x2="640" y2="820" stroke="#333333"/>
  <rect x="210" y="593.4" width="75" height="226.6" fill="#d7301f" stroke="#222222"/>
  <rect x="292" y="636.4" width="75" height="183.6" fill="#756bb1" stroke="#222222"/>
  <rect x="430" y="592.2" width="75" height="227.8" fill="#d7301f" stroke="#222222"/>
  <rect x="512" y="641.5" width="75" height="178.5" fill="#756bb1" stroke="#222222"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="247.5" y="584" fill="#b2180d">47,944</text><text x="329.5" y="627" fill="#54278f">38,833</text>
    <text x="467.5" y="583" fill="#b2180d">48,186</text><text x="549.5" y="632" fill="#54278f">37,760</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333" text-anchor="middle">
    <text x="289" y="848">均值</text><text x="509" y="848">中位数</text>
  </g>

  <!-- D: log1p total coverage, explicitly truncated axis -->
  <text x="1027" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">D. log1p（总覆盖量）</text>
  <text x="1027" y="544" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a63603">纵轴截断为 11.5–13.0</text>
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="770" y1="820" x2="1315" y2="820"/><line x1="770" y1="733.3" x2="1315" y2="733.3"/><line x1="770" y1="646.7" x2="1315" y2="646.7"/><line x1="770" y1="560" x2="1315" y2="560"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" text-anchor="end">
    <text x="760" y="825">11.5</text><text x="760" y="738">12.0</text><text x="760" y="652">12.5</text><text x="760" y="565">13.0</text>
  </g>
  <line x1="770" y1="560" x2="770" y2="820" stroke="#333333"/><line x1="770" y1="820" x2="1315" y2="820" stroke="#333333"/>
  <!-- axis break marks -->
  <path d="M762 808 l16 8 l-16 8 l16 8" fill="none" stroke="#333333" stroke-width="2"/>
  <rect x="865" y="632.7" width="75" height="187.3" fill="#d7301f" stroke="#222222"/>
  <rect x="947" y="684.3" width="75" height="135.7" fill="#756bb1" stroke="#222222"/>
  <rect x="1085" y="620.9" width="75" height="199.1" fill="#d7301f" stroke="#222222"/>
  <rect x="1167" y="688.3" width="75" height="131.7" fill="#756bb1" stroke="#222222"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="902.5" y="623" fill="#b2180d">12.5806</text><text x="984.5" y="675" fill="#54278f">12.2833</text>
    <text x="1122.5" y="611" fill="#b2180d">12.6487</text><text x="1204.5" y="679" fill="#54278f">12.2598</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333" text-anchor="middle">
    <text x="943" y="848">均值</text><text x="1163" y="848">中位数</text>
  </g>

  <!-- statistical note -->
  <text x="700" y="925" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333333">总覆盖量 Mann–Whitney U = 90,971.5；双侧 P = 1.75 × 10⁻²⁴</text>
  <text x="700" y="952" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666666">红色：ROI 内 165 个杂色非单核细胞 · 紫色：同一 ROI 内 731 个单核细胞 · 柱高为表中汇总值</text>
</svg>
